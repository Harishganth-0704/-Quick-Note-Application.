<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QuickNote | Organize Your Thoughts</title>
    <meta name="description" content="A beautiful and simple full-stack note taking application.">
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <div class="app-container">
        <header class="app-header">
            <h1><i class="fa-solid fa-pen-nib"></i> QuickNote</h1>
            <p>Capture your thoughts effortlessly</p>
        </header>

        <main class="app-content">
            <section class="note-input-section">
                <div class="input-glass">
                    <textarea id="note-input" placeholder="What's on your mind?..." rows="4"></textarea>
                    <div class="input-actions">
                        <button id="save-btn" class="primary-btn">
                            <i class="fa-solid fa-paper-plane"></i> Save Note
                        </button>
                    </div>
                </div>
            </section>

            <section class="notes-display-section">
                <div class="section-header">
                    <h2>Your Notes</h2>
                    <span id="note-count" class="badge">0</span>
                </div>
                <div id="notes-container" class="notes-grid">
                    <!-- Notes will be injected here dynamically -->
                </div>
            </section>
        </main>
    </div>
    
    <script src="script.js"></script>
</body>
</html>
